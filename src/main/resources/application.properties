spring.application.name=is-lab-1
server.servlet.context-path=/is-lab-1
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/lab_db}
spring.datasource.username=${DB_USERNAME:ldpst}
spring.datasource.password=${DB_PASSWORD:ldpst}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_schema=variant2
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
logging.level.org.springframework.web=DEBUG