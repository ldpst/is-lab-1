plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'ru.itmo'
version = '2.0.0'

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-websocket'
    runtimeOnly 'org.postgresql:postgresql'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'org.flywaydb:flyway-database-postgresql'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
tasks.withType(Test).configureEach { useJUnitPlatform() }

def npmExecutable = System.getProperty('os.name').toLowerCase().contains('windows') ? 'npm.cmd' : 'npm'

tasks.register('frontendInstall', Exec) {
    group = 'build'
    description = 'Installs pinned React frontend dependencies.'
    workingDir file('frontend')
    commandLine npmExecutable, 'ci'
    inputs.files 'frontend/package.json', 'frontend/package-lock.json'
    outputs.dir 'frontend/node_modules'
}

tasks.register('frontendBuild', Exec) {
    group = 'build'
    description = 'Builds the React application into the executable JAR.'
    dependsOn tasks.named('frontendInstall')
    workingDir file('frontend')
    commandLine npmExecutable, 'run', 'build'
    inputs.files fileTree('frontend/src'), 'frontend/index.html', 'frontend/vite.config.js'
    outputs.dir 'src/main/resources/static'
}

tasks.named('processResources') { dependsOn tasks.named('frontendBuild') }
tasks.named('bootJar') { archiveFileName = 'is-lab-1.jar' }

tasks.register('verifyArchitecture') {
    group = 'verification'
    description = 'Verifies boundaries between domain, application, persistence and API layers.'

    doLast {
        def sourceRoot = file('src/main/java/ru/itmo/lab')
        def violations = []

        def checkImports = { String layer, List<String> forbidden ->
            fileTree(new File(sourceRoot, layer)) { include '**/*.java' }.each { source ->
                def text = source.getText('UTF-8')
                forbidden.each { dependency ->
                    if (text.contains(dependency)) {
                        violations << "${source}: forbidden dependency ${dependency}"
                    }
                }
            }
        }

        checkImports('domain', [
                'ru.itmo.lab.application', 'ru.itmo.lab.api',
                'ru.itmo.lab.persistence', 'ru.itmo.lab.websocket'
        ])
        checkImports('application', ['ru.itmo.lab.api', 'ru.itmo.lab.persistence'])
        checkImports('api', ['ru.itmo.lab.persistence'])

        fileTree(sourceRoot) { include '**/*.java' }.each { source ->
            def normalized = source.path.replace('\\', '/')
            def text = source.getText('UTF-8')
            if (!normalized.contains('/persistence/') &&
                    (text.contains('jakarta.persistence.EntityManager') ||
                            text.contains('jakarta.persistence.PersistenceContext'))) {
                violations << "${source}: EntityManager is allowed only in persistence layer"
            }
        }

        if (!violations.isEmpty()) {
            throw new GradleException("Architecture violations:\n" + violations.join('\n'))
        }
    }
}

tasks.named('check') {
    dependsOn tasks.named('verifyArchitecture')
}
